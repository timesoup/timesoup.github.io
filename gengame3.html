<body class="flex flex-col items-center justify-center h-screen m-0 p-4" data-llm4sre-ubi-toggler-called_36.6="true" data-llm4sre-ubi-main-called_36.6="true">

    <div id="ui-container" class="w-full max-w-2xl text-center mb-4">
        <h1 class="text-3xl md:text-4xl font-bold mb-2 text-shadow text-cyan-400">Square Eating Frenzy</h1>
        <div class="flex justify-between items-center text-lg md:text-xl">
             <p class="text-shadow">Score: <span id="score">0</span></p>
             <p class="text-shadow">High Score: <span id="highScore">4</span></p>
        </div>
        <p class="text-sm mt-2 text-gray-400">Move your mouse or finger to control the square!</p>
    </div>

    <canvas id="gameCanvas" width="681" height="681"></canvas>

    <div id="gameOverScreen" class="absolute inset-0 bg-black bg-opacity-70 flex-col justify-center items-center text-center p-4 flex">
        <h2 class="text-5xl font-bold text-red-500 text-shadow">Game Over</h2>
        <p class="text-2xl mt-4 text-shadow">Your Score: <span id="finalScore">Resized!</span></p>
        <button id="restartButton" class="mt-8 px-8 py-4 bg-cyan-500 text-white font-bold rounded-lg hover:bg-cyan-600 transition-colors text-shadow text-xl">
            Restart
        </button>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreEl = document.getElementById('finalScore');
        const restartButton = document.getElementById('restartButton');
        
        let player, food, enemies, score, highScore, gameOver;
        let mouse = { x: null, y: null };

        const PLAYER_START_SIZE = 20;
        const FOOD_SIZE = 15;
        const ENEMY_START_SIZE = 25;
        const ENEMY_SPEED = 2;
        const NUM_ENEMIES = 5;

        // --- Game Setup and Control ---

        function setCanvasSize() {
            const uiHeight = document.getElementById('ui-container').offsetHeight;
            const padding = 60; // Increased padding for better layout
            const availableHeight = window.innerHeight - uiHeight - padding;
            const availableWidth = window.innerWidth * 0.95;

            const size = Math.min(availableWidth, availableHeight, 700);
            canvas.width = size;
            canvas.height = size;
        }

        function init() {
            // Player setup
            player = {
                x: canvas.width / 2,
                y: canvas.height / 2,
                size: PLAYER_START_SIZE,
                speed: 5, 
                color: '#00ffff', // Cyan
                angle: 0, // Initial angle
                rotationSpeed: 0.05 // How fast it spins
            };

            // Set initial mouse/touch target to player's start position
            mouse.x = player.x;
            mouse.y = player.y;

            // Score setup
            score = 0;
            highScore = localStorage.getItem('squareFrenzyHighScore') || 0;
            scoreEl.textContent = score;
            highScoreEl.textContent = highScore;

            // Game state
            gameOver = false;
            gameOverScreen.classList.add('hidden');
            gameOverScreen.classList.remove('flex');

            // Generate game elements
            spawnFood();
            enemies = [];
            for (let i = 0; i < NUM_ENEMIES; i++) {
                spawnEnemy();
            }
            
            // Start the game loop
            requestAnimationFrame(gameLoop);
        }

        function spawnFood() {
            food = {
                x: Math.random() * (canvas.width - FOOD_SIZE),
                y: Math.random() * (canvas.height - FOOD_SIZE),
                size: FOOD_SIZE,
                color: '#00ff00', // Green
                angle: 0,
                rotationSpeed: (Math.random() - 0.5) * 0.1 // Random spin speed and direction
            };
        }

        function spawnEnemy() {
            const size = Math.random() * 20 + ENEMY_START_SIZE;
            let x, y;
            // Spawn enemies off-screen
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? 0 - size : canvas.width + size;
                y = Math.random() * canvas.height;
            } else {
                x = Math.random() * canvas.width;
                y = Math.random() < 0.5 ? 0 - size : canvas.height + size;
            }
            
            const angleToCenter = Math.atan2((canvas.height / 2) - y, (canvas.width / 2) - x);

            enemies.push({
                x,
                y,
                size,
                color: '#ff0000', // Red
                dx: Math.cos(angleToCenter) * ENEMY_SPEED,
                dy: Math.sin(angleToCenter) * ENEMY_SPEED,
                angle: 0,
                rotationSpeed: (Math.random() - 0.5) * 0.1 // Random spin speed and direction
            });
        }


        // --- Game Loop and Drawing ---

        function gameLoop() {
            if (gameOver) return;

            update();
            draw();

            requestAnimationFrame(gameLoop);
        }

        function update() {
            // Update player angle
            player.angle += player.rotationSpeed;
            
            // Player movement towards the mouse/touch position
            const dx = mouse.x - (player.x + player.size / 2); // Target center of player
            const dy = mouse.y - (player.y + player.size / 2);
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance > player.speed) { // Move only if not at the destination
                player.x += (dx / distance) * player.speed;
                player.y += (dy / distance) * player.speed;
            } else {
                player.x = mouse.x - player.size / 2;
                player.y = mouse.y - player.size / 2;
            }


            // Keep player within canvas bounds
            player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));

            // Enemy movement and collision
            enemies.forEach((enemy, index) => {
                enemy.x += enemy.dx;
                enemy.y += enemy.dy;
                enemy.angle += enemy.rotationSpeed; // Update enemy angle

                // Reset enemy if it goes too far off-screen
                if (enemy.x < -enemy.size * 2 || enemy.x > canvas.width + enemy.size * 2 ||
                    enemy.y < -enemy.size * 2 || enemy.y > canvas.height + enemy.size * 2) {
                    enemies.splice(index, 1);
                    spawnEnemy();
                }

                if (checkCollision(player, enemy)) {
                    endGame();
                }
            });

            // Food collision
            food.angle += food.rotationSpeed; // Update food angle
            if (checkCollision(player, food)) {
                score++;
                scoreEl.textContent = score;
                player.size += 1; // Grow the player
                player.speed *= 0.995;
                spawnFood();
                if(score > 0 && score % 5 === 0) {
                   spawnEnemy();
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawSquare(food);
            enemies.forEach(drawSquare);
            drawSquare(player);
        }
        
        function drawSquare(square) {
            ctx.save(); // Save the current canvas state
            // Translate to the center of the square
            ctx.translate(square.x + square.size / 2, square.y + square.size / 2); 
            ctx.rotate(square.angle); // Rotate the canvas
            
            ctx.fillStyle = square.color;
            ctx.shadowColor = square.color;
            ctx.shadowBlur = 10;
            
            // Draw the square centered on the new origin
            ctx.fillRect(-square.size / 2, -square.size / 2, square.size, square.size);
            
            ctx.restore(); // Restore the canvas to its original state
            ctx.shadowBlur = 0; // Reset shadow blur
        }

        // --- Collision and Game State ---
        
        function checkCollision(rect1, rect2) {
            // Simple AABB collision detection is sufficient here
            return (
                rect1.x < rect2.x + rect2.size &&
                rect1.x + rect1.size > rect2.x &&
                rect1.y < rect2.y + rect2.size &&
                rect1.y + rect1.size > rect2.y
            );
        }

        function endGame() {
            gameOver = true;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('squareFrenzyHighScore', highScore);
                highScoreEl.textContent = highScore;
            }
            finalScoreEl.textContent = score;
            gameOverScreen.classList.remove('hidden');
            gameOverScreen.classList.add('flex');
        }


        // --- Event Listeners ---
        function updateMousePosition(event) {
            const rect = canvas.getBoundingClientRect();
            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const clientY = event.touches ? event.touches[0].clientY : event.clientY;
            
            mouse.x = clientX - rect.left;
            mouse.y = clientY - rect.top;
        }

        canvas.addEventListener('mousemove', updateMousePosition);
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            updateMousePosition(e);
        });
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            updateMousePosition(e);
        });

        restartButton.addEventListener('click', () => {
             setCanvasSize();
             init();
        });

        window.addEventListener('resize', () => {
            setCanvasSize();
            endGame(); 
            finalScoreEl.textContent = "Resized!";
        });

        // --- Initial Start ---
        setCanvasSize();
        init();
    </script>
