<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Shorts Style Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Prevent scrollbars from viewport */
            font-family: 'Inter', sans-serif; /* Tailwind default */
            background-color: #000; /* Black background for the page */
        }

        #player-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000; /* Black background behind video */
            z-index: 1;
        }

        #youtube-player {
            position: absolute; /* Default for portrait, JS will manage */
            background-color: #000; /* Fallback if video doesn't load immediately */
            z-index: 2;
        }
        
        /* Media query for landscape specific wrapper styling */
        @media (orientation: landscape) {
            #player-wrapper {
                display: flex;
                justify-content: center;
                align-items: center;
            }
        }

        #shorts-ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Allow clicks to pass through empty overlay areas */
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Pushes top-bar up, bottom-info down, side-bar needs own positioning */
        }

        #shorts-ui-overlay > * {
            pointer-events: auto; /* Enable pointer events for children */
        }

        .icon {
            width: 24px;
            height: 24px;
            fill: white;
            stroke: white;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        .overlay-button {
             background-color: rgba(0,0,0,0.3);
             border-radius: 9999px; /* pill shape */
             padding: 0.5rem;
             cursor: pointer;
             transition: background-color 0.2s;
        }
        .overlay-button:hover {
            background-color: rgba(0,0,0,0.5);
        }

        .subscribe-button {
            background-color: white;
            color: black;
            font-weight: bold;
            padding: 0.5rem 1rem;
            border-radius: 2px; /* YouTube style */
            font-size: 0.875rem;
            transition: background-color 0.2s;
        }
        .subscribe-button:hover {
            background-color: #f0f0f0;
        }

        /* Custom scrollbar for content if ever needed, though not for this layout */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.5);
        }

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-black">

    <div id="player-wrapper">
        <div id="youtube-player"></div>
    </div>

    <div id="shorts-ui-overlay" class="p-4 md:p-6">
        <div class="top-bar flex justify-between items-center">
            <button class="overlay-button fullscreen-trigger">
                <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div class="flex space-x-3">
                <button class="overlay-button fullscreen-trigger">
                    <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
                <button class="overlay-button fullscreen-trigger">
                    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                </button>
            </div>
        </div>

        <div class="flex-grow relative">
            <div class="side-bar absolute right-0 top-1/2 transform -translate-y-1/2 flex flex-col items-center space-y-4">
                <button class="fullscreen-trigger flex flex-col items-center text-xs">
                    <svg class="icon w-7 h-7 mb-1" viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>
                    <span>437K</span>
                </button>
                <button class="fullscreen-trigger flex flex-col items-center text-xs">
                    <svg class="icon w-7 h-7 mb-1" viewBox="0 0 24 24"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zM17 2h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path></svg>
                    <span>Dislike</span>
                </button>
                <button class="fullscreen-trigger flex flex-col items-center text-xs">
                    <svg class="icon w-7 h-7 mb-1" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    <span>4.2K</span>
                </button>
                <button class="fullscreen-trigger flex flex-col items-center text-xs">
                    <svg class="icon w-7 h-7 mb-1" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                    <span>Share</span>
                </button>
                <button class="fullscreen-trigger">
                    <div class="w-10 h-10 bg-gray-700 rounded-md border border-gray-500 flex items-center justify-center text-sm">DLF.S</div>
                </button>
            </div>
        </div>
        
        <div class="bottom-info text-sm">
            <div class="flex items-center space-x-2 mb-1">
                <div class="w-6 h-6 bg-gray-500 rounded-full"></div> <span class="font-semibold">@dalamford.supply</span>
                <button class="subscribe-button ml-2 fullscreen-trigger">Subscribe</button>
            </div>
            <p class="video-title font-medium truncate mb-0.5">YouTube Shorts UI Template Extravaganza!</p>
            <p class="sound-attribution text-xs truncate">♫ Dalamford Supply - Ciaran McCracken Originals</p>
        </div>
    </div>

    <button id="watch-video-button" class="fixed left-1/2 bottom-5 transform -translate-x-1/2 bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg z-20 transition-colors">
        Watch video
    </button>

    <script>
        let player;
        const videoId = 'B5vN0qCSg_4';
        const startTimeInSeconds = (7 * 60) + 2; // 7:02

        // This function creates an <iframe> (and YouTube player)
        // after the API code downloads.
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                // height and width will be set dynamically by resizePlayer
                videoId: videoId,
                playerVars: {
                    'autoplay': 1, // Autoplay the video on load
                    'controls': 0, // Hide player controls
                    'showinfo': 0, // Hide video title, uploader before video starts
                    'modestbranding': 1, // Hide YouTube logo as much as possible
                    'loop': 1, // Loop the video
                    'fs': 0, // Disable YouTube's own fullscreen button
                    'cc_load_policy': 0, // Hide closed captions
                    'iv_load_policy': 3, // Hide video annotations
                    'rel': 0, // Do not show related videos
                    'start': startTimeInSeconds,
                    'playlist': videoId, // Required for loop to work
                    'origin': window.location.origin // Important for some environments
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            event.target.mute(); // Mute by default for autoplay, or remove if sound desired immediately
            event.target.playVideo();
            resizePlayer(); // Initial resize
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                player.seekTo(startTimeInSeconds); // Loop manually if playlist loop fails
            }
        }

        function resizePlayer() {
            const playerElement = document.getElementById('youtube-player');
            const wrapperElement = document.getElementById('player-wrapper');
            if (!playerElement || !wrapperElement || !player) return;

            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            const videoAspectRatio = 16 / 9;

            // Set wrapper to full viewport (already done by CSS, but good for completeness)
            // wrapperElement.style.width = `${viewportWidth}px`;
            // wrapperElement.style.height = `${viewportHeight}px`;

            if (window.matchMedia("(orientation: portrait)").matches || viewportHeight > viewportWidth) {
                // Portrait or square-ish treated as portrait: Full height, width calculated, centered and cropped
                playerElement.style.height = `${viewportHeight}px`;
                const calculatedWidth = viewportHeight * videoAspectRatio;
                playerElement.style.width = `${calculatedWidth}px`;
                
                // Ensure player is absolutely positioned for transform centering
                playerElement.style.position = 'absolute';
                playerElement.style.top = '50%';
                playerElement.style.left = '50%';
                playerElement.style.transform = 'translate(-50%, -50%)';

            } else {
                // Landscape: "full vertical height ... no longer cropped"
                // Video's 16:9 content is fully visible, scaled to fit 100vh.
                // Centered by flex on player-wrapper.
                playerElement.style.position = 'relative'; // Let flexbox on wrapper handle centering
                playerElement.style.top = 'auto';
                playerElement.style.left = 'auto';
                playerElement.style.transform = 'none';

                const potentialWidthAtFullHeight = viewportHeight * videoAspectRatio;

                if (potentialWidthAtFullHeight <= viewportWidth) {
                    // Video at full height fits within viewport width
                    playerElement.style.height = `${viewportHeight}px`;
                    playerElement.style.width = `${potentialWidthAtFullHeight}px`;
                } else {
                    // Video at full height would be wider than viewport; scale to fit width instead,
                    // this will result in letterboxing (black bars top/bottom) if height is not 100vh.
                    // The requirement is "full vertical height", so this path prioritizes that.
                    // If screen is very narrow landscape, video will be 100vh tall and its width (16/9 * 100vh)
                    // will be wider than 100vw; the player-wrapper's overflow:hidden will clip it.
                    // To ensure "not cropped" means the 16:9 frame itself is visible, even if overflowing:
                    // This interpretation: scale to 100vh height. Center. Parts outside 100vw are hidden by wrapper.
                    playerElement.style.height = `${viewportHeight}px`;
                    playerElement.style.width = `${potentialWidthAtFullHeight}px`;

                    // If "not cropped" also implies it *must fit entirely within 100vw*:
                    // then if potentialWidthAtFullHeight > viewportWidth, we'd do:
                    // playerElement.style.width = `${viewportWidth}px`;
                    // playerElement.style.height = `${viewportWidth / videoAspectRatio}px`;
                    // But this would break "full vertical height". So the above is chosen.
                }
            }
             // After resizing, ensure the player API is updated if necessary (usually not for size)
            if (player && typeof player.setSize === 'function') {
                 // player.setSize(parseInt(playerElement.style.width), parseInt(playerElement.style.height));
                 // YT API usually handles iframe size changes automatically, this might not be needed.
            }
        }

        function toggleFullScreen() {
            const elem = document.documentElement;
            if (!document.fullscreenElement) {
                elem.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                    // Fallback for browsers that might not support it well, or iframes disallow it
                    // In a real scenario, you might show a custom message here.
                    // For this demo, we log the error.
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Event Listeners
        window.addEventListener('resize', resizePlayer);
        window.addEventListener('orientationchange', resizePlayer);

        // Add fullscreen toggle to all designated buttons
        document.querySelectorAll('.fullscreen-trigger').forEach(button => {
            button.addEventListener('click', toggleFullScreen);
        });

        // "Watch video" button functionality
        document.getElementById('watch-video-button').addEventListener('click', () => {
            const videoUrl = `https://www.youtube.com/watch?v=${videoId}&t=${startTimeInSeconds}s`;
            window.open(videoUrl, '_blank');
        });

        // Load the IFrame Player API code asynchronously.
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // Initial call in case events don't fire immediately or for initial setup
        // onYouTubeIframeAPIReady will call resizePlayer once player is ready.
    </script>
</body>
</html>
